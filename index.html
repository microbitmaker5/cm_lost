<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff7a90">
    <title>청미르초등학교 분실물 센터</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquareRound@1.0/nanumsquareround.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        :root{ --ink:#3a2d4d; --muted:#8a7ba0; }
        *{box-sizing:border-box}
        body {
            font-family:"NanumSquareRound","Gowun Dodum","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
            background-color:#fff8e7;
            background-image:radial-gradient(#ffe2a8 2.2px,transparent 2.4px),radial-gradient(#ffd0dc 2px,transparent 2.2px);
            background-size:34px 34px,34px 34px;background-position:0 0,17px 17px;
            margin:0; padding:20px; color:var(--ink); letter-spacing:-.2px;
        }
        .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; position:relative; z-index:1; }
        body::before,body::after{position:fixed;z-index:0;pointer-events:none;font-size:34px;opacity:.5}
        body::before{content:"☁️";right:5%;top:18px;animation:floaty 6s ease-in-out infinite}
        body::after{content:"⭐";left:3%;bottom:16px;animation:floaty 5s ease-in-out infinite reverse}
        @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-12px) rotate(6deg)}}
        @keyframes popin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

        h1 { text-align: center; margin: 6px 0 0; font-size:30px; font-weight:800; color:#ff5c7a; text-shadow:2px 2px 0 #ffe0e6; }
        .sub { text-align:center; margin:0 0 4px; color:var(--muted); font-size:14px; font-weight:700; }

        .form-section { background: #fff; padding: 22px; border-radius: 26px; border:3px solid #ffd0dc; box-shadow: 0 7px 0 #ffd0dc; animation:popin .5s both; }
        .form-section h2 { margin-top: 0; color:#e0566f; font-size: 20px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 800; color: #b98a3a; }
        .form-group input[type="text"] { padding: 12px 14px; border: 3px solid #ffe6bf; border-radius: 16px; font-size: 15px; background:#fffdf5; font-family:inherit; color:var(--ink); transition:border-color .15s; }
        .form-group input[type="text"]:focus { outline:none; border-color:#ff7a90; }

        .file-upload-wrapper { position: relative; display: flex; align-items: center; }
        .form-group input[type="file"] { display: none; }
        .custom-file-btn {
            width: 100%; padding: 11px 14px; border: 3px dashed #ffc93c; border-radius: 16px;
            background: #fff9e6; color: #b98a3a; font-size: 14px; font-weight: 800;
            cursor: pointer; text-align: center; transition: all 0.15s;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
        }
        .custom-file-btn:hover { background: #fff0c2; border-color: #ffa94d; transform: translateY(-1px); }
        .custom-file-btn.has-file { border-style: solid; border-color: #3ddbb0; background: #e6fcf5; color: #0ca678; }

        .btn-submit { width: 100%; padding: 15px; background:linear-gradient(135deg,#ff7a90,#ffa45c); color: white; border:none; border-radius: 999px; font-size: 17px; font-weight: 800; font-family:inherit; cursor: pointer; box-shadow:0 5px 0 #e0566f; transition:transform .12s, box-shadow .12s; }
        .btn-submit:active { transform:translateY(3px); box-shadow:0 2px 0 #e0566f; }
        .btn-submit:disabled { background:#e3e6ee; color:#aab0c0; cursor: not-allowed; box-shadow:none; }

        .stats-section {
            background: #fff; padding: 18px 22px; border-radius: 24px;
            border: 3px solid #bde0fe; box-shadow: 0 6px 0 #bde0fe;
            animation: popin .5s both;
        }
        .stats-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .stats-title { font-size: 16px; font-weight: 800; color: #339af0; display: flex; align-items: center; gap: 6px; }
        .stats-numbers { font-size: 14px; font-weight: 800; color: var(--ink); background: #e7f5ff; padding: 4px 12px; border-radius: 999px; }
        .progress-track { width: 100%; height: 22px; background: #f1f3f5; border-radius: 999px; overflow: hidden; border: 2px solid #dee2e6; position: relative; }
        .progress-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #4dabf7, #3ddbb0);
            border-radius: 999px; transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; justify-content: flex-end; padding-right: 10px;
            color: #fff; font-size: 12px; font-weight: 800;
        }

        .list-section h2 { color:#4dabf7; font-size: 20px; margin: 0 0 14px; display:flex; align-items:center; gap:8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
        .card {
            --c:#ff7a90;
            position: relative;
            background: #fff; border-radius: 22px; overflow: hidden;
            border:3px solid var(--c); box-shadow: 0 6px 0 var(--c);
            transition: transform 0.15s; animation:popin .45s both;
            display: flex; flex-direction: column;
        }
        .card:nth-child(6n+1){--c:#ff7a90}.card:nth-child(6n+2){--c:#4dabf7}.card:nth-child(6n+3){--c:#3ddbb0}
        .card:nth-child(6n+4){--c:#ffa94d}.card:nth-child(6n+5){--c:#9775fa}.card:nth-child(6n+6){--c:#f783ac}
        .card:hover { transform: translateY(-5px) rotate(-0.5deg); }
        
        .card-clickable { cursor: zoom-in; }
        .card-img { width: 100%; height: 170px; object-fit: cover; background-color: #fdf1d8; display:block; }
        .card-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; }
        
        .card-title { font-size: 16.5px; font-weight: 800; color: var(--ink); margin: 0 0 10px 0; display: flex; align-items: center; gap: 6px; line-height: 1.3; }
        .seq-badge {
            background: var(--c); color: #fff; font-size: 12px; font-weight: 800;
            padding: 2px 8px; border-radius: 999px; flex-shrink: 0;
        }
        .card-info { font-size: 13.5px; color: #7a7390; margin: 4px 0; display: flex; align-items:center; gap:6px; }
        .info-label { min-width: 56px; color:color-mix(in srgb, var(--c) 70%, #000); font-weight: 800; }

        .reserve-note {
            margin: 8px 0 4px; padding: 7px 10px; border-radius: 12px;
            background: #fff3bf; border: 1.5px dashed #fcc419;
            font-size: 13px; font-weight: 800; color: #d9480f;
            word-break: break-all;
        }
        .card-actions { margin-top: auto; padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .btn-action {
            width: 100%; padding: 8px 10px; border: none; border-radius: 12px;
            font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer;
            transition: transform 0.1s, opacity 0.15s;
        }
        .btn-action:active { transform: scale(0.97); }
        .btn-reserve { background: #fff3bf; color: #e67700; border: 2px solid #ffd43b; }
        .btn-reserve:hover { background: #ffec99; }
        .btn-complete { background: #e6fcf5; color: #0ca678; border: 2px solid #63e6be; }
        .btn-complete:hover { background: #c3fae8; }

        .card.is-completed { border-color: #adb5bd; box-shadow: 0 6px 0 #adb5bd; }
        .card.is-completed:hover { transform: none; }
        .completed-overlay {
            position: absolute; inset: 0;
            background: rgba(134, 142, 150, 0.68);
            backdrop-filter: blur(2px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; pointer-events: auto;
        }
        .completed-stamp {
            background: #fff; color: #495057; border: 4px solid #495057;
            padding: 8px 20px; border-radius: 16px; font-size: 20px; font-weight: 800;
            transform: rotate(-8deg); box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            letter-spacing: 1px;
        }
        .completed-sub {
            margin-top: 10px; color: #fff; font-size: 13px; font-weight: 800;
            background: rgba(0,0,0,0.35); padding: 3px 10px; border-radius: 999px;
        }

        .zoom-modal {
            display: none; position: fixed; inset: 0; z-index: 999;
            background: rgba(40, 30, 55, 0.72); backdrop-filter: blur(4px);
            align-items: center; justify-content: center; padding: 20px;
            cursor: zoom-out;
        }
        .zoom-modal.active { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .zoom-card {
            background: #fff; border-radius: 30px; border: 5px solid #ff7a90;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            width: min(92vw, 680px); max-height: 90vh; overflow-y: auto;
            display: flex; flex-direction: column;
            animation: zoomScale 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes zoomScale { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .zoom-img { width: 100%; max-height: 55vh; object-fit: contain; background: #fdf1d8; }
        .zoom-body { padding: 24px 28px; }
        .zoom-title { font-size: 26px; font-weight: 800; color: var(--ink); margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
        .zoom-info { font-size: 18px; color: #5f5873; margin: 8px 0; font-weight: 700; }
        .zoom-hint { text-align: center; font-size: 13px; color: #adb5bd; margin-top: 16px; font-weight: 700; }

        .empty-note, .error-note { grid-column: 1/-1; text-align: center; font-weight:700; padding:20px; border-radius:18px; }
        .empty-note { color:#b98a3a; background:#fff6cf; border:2px dashed #ffc93c; }
        .error-note { color:#e0566f; background:#ffe6ea; border:2px dashed #ff9fae; }

        @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
        @media(max-width:600px){ h1{font-size:24px} .form-section{padding:16px} .zoom-title{font-size:20px} .zoom-info{font-size:15px} }
    </style>
</head>
<body>

<div class="container">
    <h1>🧢 청미르초등학교 분실물 센터</h1>
    <p class="sub">주운 물건을 등록하고, 잃어버린 물건을 찾아보세요</p>

    <div class="form-section">
        <h2>➕ 새 분실물 등록하기 (사진 첨부 가능)</h2>
        <form id="lostForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="date">📅 분실날짜</label>
                    <input type="text" id="date" placeholder="예: 26.10.03" required>
                </div>
                <div class="form-group">
                    <label for="place">📍 분실장소</label>
                    <input type="text" id="place" placeholder="예: 운동장, 2학년복도" required>
                </div>
                <div class="form-group">
                    <label for="name">🎒 분실물명</label>
                    <input type="text" id="name" placeholder="예: 아이패드 펜슬, 지갑" required>
                </div>
                <div class="form-group">
                    <label for="imageFile">📷 분실물사진 등록</label>
                    <div class="file-upload-wrapper">
                        <label for="imageFile" id="fileLabel" class="custom-file-btn">📁 사진 선택하기 (클릭)</label>
                        <input type="file" id="imageFile" accept="image/*">
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-submit">사진 업로드 및 시트 저장</button>
        </form>
    </div>

    <div class="stats-section">
        <div class="stats-header">
            <div class="stats-title">📊 분실물 주인 찾아주기 현황</div>
            <div class="stats-numbers" id="statsText">전체 0건 중 0건 수령완료 (0%)</div>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill">0%</div>
        </div>
    </div>

    <div class="list-section">
        <h2>🔎 최근 등록된 분실물 (클릭하면 크게 보여요!)</h2>
        <div id="lost-grid" class="grid">
            <p class="empty-note" style="grid-column: 1/-1;">데이터를 동기화하는 중...</p>
        </div>
    </div>
</div>

<div id="zoomModal" class="zoom-modal" onclick="closeZoomModal()">
    <div class="zoom-card" id="zoomCardContent"></div>
</div>

<script>
    const webAppUrl = "https://script.google.com/macros/s/AKfycbyeE1A4hnZrxCGFghEZ4KdhIUBq15Zl3NX7GWSOkZiMkypxbcKgPiPFHGwY1wwsjgBl/exec";

    const imageInput = document.getElementById("imageFile");
    const fileLabel = document.getElementById("fileLabel");
    imageInput.addEventListener("change", function() {
        if (this.files && this.files.length > 0) {
            fileLabel.textContent = "✅ " + this.files[0].name;
            fileLabel.classList.add("has-file");
        } else {
            fileLabel.textContent = "📁 사진 선택하기 (클릭)";
            fileLabel.classList.remove("has-file");
        }
    });

    function loadLostItems() {
        fetch(webAppUrl)
            .then(response => response.json())
            .then(res => {
                const items = Array.isArray(res) ? res : (res.items || []);
                const totalCount = res.totalCount !== undefined ? res.totalCount : items.length;
                const completedCount = res.completedCount !== undefined 
                    ? res.completedCount 
                    : items.filter(i => i.completed === true || i.completed === "수령완료").length;

                updateStatsBar(totalCount, completedCount);

                const grid = document.getElementById("lost-grid");
                grid.innerHTML = "";

                if (items.length === 0) {
                    grid.innerHTML = "<p class='empty-note'>등록된 분실물이 없습니다.</p>";
                    return;
                }

                items.forEach((item, idx) => {
                    const seq = item.seq || (items.length - idx);
                    const isCompleted = (item.completed === true || item.completed === "수령완료");
                    const reserveText = item.reserve || "";
                    const imgUrl = item.image || 'https://via.placeholder.com/300x200?text=No+Image';

                    const card = document.createElement("div");
                    card.className = "card" + (isCompleted ? " is-completed" : "");

                    card.innerHTML = `
                        ${isCompleted ? `
                            <div class="completed-overlay" onclick="openZoomModal(${idx})">
                                <div class="completed-stamp">✨ 수령완료 ✨</div>
                                <div class="completed-sub">주인을 찾았어요!</div>
                            </div>
                        ` : ""}
                        <div class="card-clickable" onclick="openZoomModal(${idx})">
                            <img class="card-img" src="${imgUrl}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                            <div class="card-body" style="padding-bottom: 6px;">
                                <h3 class="card-title">
                                    <span class="seq-badge">No.${seq}</span>
                                    <span>🎁 ${item.name}</span>
                                </h3>
                                <div class="card-info"><span class="info-label">📅 분실일</span> <span>${item.date}</span></div>
                                <div class="card-info"><span class="info-label">📍 장소</span> <span>${item.place}</span></div>
                                ${reserveText ? `<div class="reserve-note">📌 예약: ${escapeHtml(reserveText)}</div>` : ""}
                            </div>
                        </div>
                        <div class="card-body" style="padding-top: 0;">
                            <div class="card-actions">
                                <button type="button" class="btn-action btn-reserve" onclick="handleReserve(${seq}, '${escapeJs(reserveText)}')">
                                    ✍️ ${reserveText ? "예약 수정 (20자)" : "예약하기"}
                                </button>
                                <button type="button" class="btn-action btn-complete" onclick="handleComplete(${seq})">
                                    ✅ 수령완료
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                window.__lostItems = items;
            })
            .catch(err => {
                console.error(err);
                document.getElementById("lost-grid").innerHTML = "<p class='error-note'>데이터 로딩 실패</p>";
            });
    }

    function updateStatsBar(total, completed) {
        const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
        document.getElementById("statsText").textContent = `전체 ${total}건 중 ${completed}건 수령완료 (${percent}%)`;
        const fill = document.getElementById("progressFill");
        fill.style.width = percent + "%";
        fill.textContent = percent >= 10 ? percent + "%" : "";
    }

    function openZoomModal(idx) {
        const item = window.__lostItems && window.__lostItems[idx];
        if (!item) return;
        const seq = item.seq || "";
        const imgUrl = item.image || 'https://via.placeholder.com/600x400?text=No+Image';
        const modal = document.getElementById("zoomModal");
        const content = document.getElementById("zoomCardContent");
        content.innerHTML = `
            <img class="zoom-img" src="${imgUrl}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
            <div class="zoom-body">
                <h3 class="zoom-title">
                    ${seq ? `<span class="seq-badge" style="font-size:16px;padding:4px 12px;">No.${seq}</span>` : ""}
                    <span>🎁 ${item.name}</span>
                </h3>
                <div class="zoom-info">📅 <strong>분실일:</strong> ${item.date}</div>
                <div class="zoom-info">📍 <strong>분실장소:</strong> ${item.place}</div>
                ${item.reserve ? `<div class="reserve-note" style="font-size:16px;margin-top:12px;">📌 예약 메모: ${escapeHtml(item.reserve)}</div>` : ""}
                <div class="zoom-hint">👆 화면 아무 곳이나 한 번 더 클릭하면 원래 크기로 돌아갑니다</div>
            </div>
        `;
        modal.classList.add("active");
    }

    function closeZoomModal() {
        document.getElementById("zoomModal").classList.remove("active");
    }

    function handleReserve(seq, currentText) {
        const input = prompt("예약자 정보나 메모를 입력하세요 (최대 20자):", currentText || "");
        if (input === null) return;

        const trimmed = input.trim();
        if (trimmed.length > 20) {
            alert(`글자 수가 ${trimmed.length}자입니다. 20자 이내로 입력해주세요!`);
            return;
        }

        postAction({
            action: "reserve",
            seq: seq,
            reserve: trimmed
        }, "예약 내용이 구글 시트에 저장되었습니다.");
    }

    function handleComplete(seq) {
        if (!confirm(`No.${seq} 분실물을 '수령완료' 처리할까요?`)) return;

        postAction({
            action: "complete",
            seq: seq
        }, "수령완료 처리되었습니다!");
    }

    function postAction(payload, successMsg) {
        fetch(webAppUrl, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(response => {
            if (response.status === "success") {
                alert(successMsg);
                loadLostItems();
            } else {
                alert("처리 실패: " + (response.message || "오류 발생"));
            }
        })
        .catch(err => {
            console.error(err);
            alert("서버 통신 오류가 발생했습니다.");
        });
    }

    document.getElementById("lostForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const submitBtn = document.querySelector(".btn-submit");
        submitBtn.innerText = "사진 및 데이터 업로드 중 (잠시만 기다려주세요)...";
        submitBtn.disabled = true;

        const fileInput = document.getElementById("imageFile");
        const file = fileInput.files[0];

        const payload = {
            action: "create",
            date: document.getElementById("date").value,
            place: document.getElementById("place").value,
            name: document.getElementById("name").value,
            fileData: null,
            fileName: null
        };

        if (file) {
            const reader = new FileReader();
            reader.onloadend = function() {
                payload.fileData = reader.result;
                payload.fileName = file.name;
                sendData(payload, submitBtn);
            };
            reader.readAsDataURL(file);
        } else {
            sendData(payload, submitBtn);
        }
    });

    function sendData(payload, submitBtn) {
        fetch(webAppUrl, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(response => {
            if (response.status === "success") {
                alert("구글 드라이브 사진 저장 및 시트 등록 완료!");
                document.getElementById("lostForm").reset();
                fileLabel.textContent = "📁 사진 선택하기 (클릭)";
                fileLabel.classList.remove("has-file");
                loadLostItems();
            } else {
                alert("등록 실패: " + response.message);
            }
        })
        .catch(err => {
            console.error(err);
            alert("서버 통신 오류가 발생했습니다.");
        })
        .finally(() => {
            submitBtn.innerText = "사진 업로드 및 시트 저장";
            submitBtn.disabled = false;
        });
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function escapeJs(str) {
        return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    window.onload = loadLostItems;
</script>
